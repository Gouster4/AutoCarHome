name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for changelog generation via git history

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: '36.0.0'

      - name: Restore Keystore from GitHub Secrets
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.SIGNING_KEY_STORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore

      - name: Make build script executable and run it
        working-directory: minicarhome
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Determine Version & Tag
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            DATE_TAG=$(date +'%Y%m%d')
            VERSION="v${DATE_TAG}-${GITHUB_SHA::7}"
          fi
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: "AutoCarHome Release ${{ steps.
